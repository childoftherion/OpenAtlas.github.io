backend:
  name: git-gateway
  branch: main # Branch to update (optional, defaults to master)

media_folder: "public/assets/images" # Folder where user uploaded files will be stored
public_folder: "/assets/images" # The same path without a leading slash. This is where the images are served from.

collections:
  - name: "journal" # Used in the URL, e.g., /admin/collections/journal
    label: "Journal" # Used in the UI
    folder: "src/content/journal" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{slug}}" # Filename template, e.g., '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Body", name: "body", widget: "markdown"}

